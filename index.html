<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal VOD — SOOP 순수 조회수 필터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --surface:#12151c;
    --surface-2:#171b24;
    --border:#252a35;
    --text:#e7e9ee;
    --text-muted:#868d9c;
    --text-dim:#565c69;
    --accent:#3aa0ff;
    --accent-dim:#1c3a54;
    --good:#34d399;
    --good-dim:#123b30;
    --warn:#fb6b6b;
    --warn-dim:#3d1a1e;
    --caution:#ffb020;
    --radius:10px;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;
    --surface:#ffffff;
    --surface-2:#eef0f4;
    --border:#dde1e8;
    --text:#1b1e26;
    --text-muted:#5b6270;
    --text-dim:#8890a0;
    --accent:#1b7fe0;
    --accent-dim:#e2f0ff;
    --good:#0fa876;
    --good-dim:#e3f8f0;
    --warn:#e0393f;
    --warn-dim:#fdeced;
    --caution:#c97b00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(58,160,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(52,211,153,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
    transition:background-color .2s, color .2s;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(27,127,224,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(15,168,118,0.05), transparent 55%),
      var(--bg);
  }

  .wrap{max-width:920px;margin:0 auto;}

  /* ---- Header ---- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:56px;height:56px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), #7bd0ff);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 24px rgba(58,160,255,0.35);
  }
  .brand-mark svg{width:24px;height:24px;}
  .brand h1{
    font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;
  }
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--text-muted);}
  
  .header-actions { display:flex; align-items:center; gap: 8px; }

  .theme-toggle, .btn-ghost{
    display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-muted);
    padding:7px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);
    transition:background .15s,color .15s,border-color .15s; cursor: pointer; font-family: inherit;
  }
  .theme-toggle:hover, .btn-ghost:hover{background:var(--surface-2);color:var(--text);}
  .theme-toggle svg{width:14px;height:14px;flex-shrink:0;}

  /* ---- Streamer Tags ---- */
  .streamer-list{display:flex;flex-wrap:wrap;gap:8px;}
  .streamer-list:empty{margin-top:0;}
  .streamer-tag{
    display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:4px 4px 4px 4px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
    -webkit-tap-highlight-color:transparent;
  }
  .streamer-tag:hover{background:var(--surface);border-color:var(--text-dim);}
  .streamer-tag:active{transform:scale(.97);}
  
  .streamer-tag-avatar{
    width:24px;height:24px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:11px;
  }
  .streamer-tag-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .streamer-tag-nick{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap; padding-right:4px;}
  .streamer-tag-id{font-size:10.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  
  .remove-streamer {
    background: transparent; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 16px; padding: 0 8px; border-radius: 50%; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s; height: 24px;
  }
  .remove-streamer:hover { color: var(--warn); background: var(--warn-dim); }

  /* ---- Control panel ---- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .panel-title{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin:0 0 14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;color:var(--text-muted);}
  
  input[type="text"], input[type="number"]{
    background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text);
    padding:9px 11px;font-size:13.5px;font-family:'JetBrains Mono',monospace;outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--accent);}
  .num-input{width:88px;}
  .tilde{color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);cursor:pointer;user-select:none;}
  .checkline input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}

  button{font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:none;}
  .btn-primary{
    background:var(--accent);color:#04121f;font-weight:700;font-size:13.5px;
    padding:10px 18px;border-radius:7px;transition:filter .15s, transform .1s;margin-left:auto; display:flex; align-items:center; justify-content:center; gap: 6px;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(.97);}
  .btn-primary:disabled{opacity:.4;cursor:default;filter:none;}

  /* ---- Signal / progress meter ---- */
  .meter-row{display:flex;align-items:center;gap:14px;}
  .meter{display:flex;gap:3px;align-items:flex-end;height:22px;}
  .meter span{width:5px;background:var(--border);border-radius:2px;transition:background .2s;}
  .meter span:nth-child(1){height:30%;} .meter span:nth-child(2){height:50%;}
  .meter span:nth-child(3){height:70%;} .meter span:nth-child(4){height:90%;}
  .meter span:nth-child(5){height:60%;} .meter span:nth-child(6){height:40%;}
  .meter.active span{background:var(--accent);animation:bounce 0.9s ease-in-out infinite;}
  .meter.active span:nth-child(2){animation-delay:.1s;}
  .meter.active span:nth-child(3){animation-delay:.2s;}
  .meter.active span:nth-child(4){animation-delay:.3s;}
  .meter.active span:nth-child(5){animation-delay:.15s;}
  .meter.active span:nth-child(6){animation-delay:.25s;}
  @keyframes bounce{0%,100%{opacity:.4;}50%{opacity:1;}}
  .status-text{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);}
  .status-text b{color:var(--text);font-weight:700;}

  /* ---- Results ---- */
  .results-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
  .results-head h2{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0;color:var(--text);}
  .results-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);background:var(--accent-dim);padding:3px 9px;border-radius:999px;}
  .results-head-left{display:flex;align-items:center;gap:10px;}
  .refresh-timer{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .refresh-btn{
    display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    transition:background .15s,color .15s,border-color .15s;padding:0;flex-shrink:0;
  }
  .refresh-btn svg{width:13px;height:13px;transition:transform .5s ease;}
  .refresh-btn:hover:not(:disabled){background:var(--surface-2);color:var(--text);border-color:var(--text-dim);}
  .refresh-btn:disabled{opacity:.35;cursor:default;}
  .refresh-btn.spinning svg{animation:refresh-spin .7s linear infinite;}
  @keyframes refresh-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
  .list-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 12px;border-bottom:1px solid var(--border);
    transition:background .12s;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--surface-2);}
  .list-main{display:flex;align-items:center;gap:10px;flex:1 1 160px;min-width:0;}
  .list-rank{width:20px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-align:right;}
  .thumb{width:56px;height:33px;border-radius:6px;background:var(--surface-2);flex-shrink:0;overflow:hidden;position:relative;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .list-title{flex:1;min-width:0;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-title a{color:inherit;text-decoration:none;}
  .list-title a:hover{color:var(--accent);}
  .list-meta{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;white-space:nowrap;}
  .list-count{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px;}
  .list-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;font-family:'JetBrains Mono',monospace;}
  .badge.good{background:var(--good-dim);color:var(--good);}
  .badge.warn{background:var(--warn-dim);color:var(--warn);}
  .badge.pending{background:var(--surface-2);color:var(--text-dim);}

  .empty, .error-box{
    text-align:center;padding:44px 20px;color:var(--text-muted);font-size:13px;
    background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .error-box{border-color:var(--warn-dim);color:var(--warn);border-style:solid;}
  .error-box b{display:block;color:var(--text);font-size:13.5px;margin-bottom:6px;}

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <!-- 임의의 플레이 로고 SVG 삽입 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <div>
        <h1>VOD 심폐소생기</h1>
        <p>SOOP 다시보기 순수 조회수 · 영구보관 상태 필터</p>
      </div>
    </div>
    
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" type="button">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
        <span id="themeLabel">다크 모드</span>
      </button>
    </div>
  </header>

  <div class="panel">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
      <div style="display:flex; flex-direction:column; gap:14px; flex:1 1 auto; min-width:200px;">
        <!-- 커스텀 스트리머 추가 영역 -->
        <div style="display:flex; gap:6px; align-items:center;">
          <input type="text" id="newStreamerId" placeholder="SOOP 아이디 입력 (예: choiagain)" style="width:240px; font-size:12.5px;">
          <button class="btn-ghost" id="addStreamerBtn" style="padding: 8px 14px; margin:0;">아이디 등록</button>
        </div>
        <div class="streamer-list" id="streamerList" style="margin:0;"></div>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-start; margin-top:4px;">
        <button class="btn-primary" id="fetchBtn" style="margin-left:0;flex-shrink:0;">목록 조회 시작 ▶</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <p class="panel-title">순수 조회수 필터</p>
    <div class="row">
      <div class="field">
        <label>최소</label>
        <input type="number" class="num-input" id="minCount" value="0" min="0">
      </div>
      <span class="tilde" style="margin-top:18px;">~</span>
      <div class="field">
        <label>최대</label>
        <input type="number" class="num-input" id="maxCount" value="999" min="0">
      </div>
      <label class="checkline" style="margin-top:18px; margin-right: 12px;">
        <input type="checkbox" id="deleteSoonOnly">
        30일 내 삭제예정만
      </label>
      
      <!-- 재생수 지정 및 재생 버튼 추가 (정렬 필터 포함) -->
      <div class="field" style="margin-top:0;">
        <label>자동 채우기 기준 및 동시 재생</label>
        <div style="display:flex; gap:6px;">
          <select id="sortOrder" style="background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px 10px;font-size:12.5px;outline:none;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
            <option value="oldest">오래된순</option>
            <option value="newest">최신순</option>
            <option value="views_asc">조회수 낮은순</option>
            <option value="views_desc">조회수 높은순</option>
          </select>
          <input type="number" class="num-input" id="playCount" value="1" min="1" max="10" style="width: 60px;">
          <button class="btn-primary" id="startBatchPlayBtn" style="margin:0; padding: 0 12px; font-size: 12.5px;">▶ 재생</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="meter-row">
      <div class="meter" id="meter"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="status-text" id="statusText">대기 중</div>
    </div>
  </div>

  <div class="panel" id="playerBox" hidden>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <p class="panel-title" style="margin:0;">재생 중 <span id="playerCount" style="color:var(--accent);"></span></p>
      <button class="btn-ghost" id="playerCloseAll">전체 닫기</button>
    </div>
    <div id="playerGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;"></div>
  </div>

  <div class="results-head">
    <div class="results-head-left">
      <h2>리스트</h2>
      <select id="listSortOrder" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;outline:none;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-left:8px;">
        <option value="newest">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="views_asc">조회수 낮은순</option>
        <option value="views_desc">조회수 높은순</option>
      </select>
      <span class="refresh-timer" id="refreshTimer"></span>
      <button class="refresh-btn" id="refreshBtn" type="button" title="조회수 새로고침" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
    <span class="results-count" id="resultsCount">0개</span>
  </div>

  <div id="results">
    <div class="empty">아직 조회된 데이터가 없습니다.</div>
  </div>

</div>

<script>
  const $ = sel => document.querySelector(sel);

  /* ---- 기존 테마 변경 로직 ---- */
  const THEME_KEY = 'vod-console-theme';
  const themeToggleBtn = $('#themeToggle');
  const themeIcon = $('#themeIcon');
  const themeLabel = $('#themeLabel');
  const SUN_PATH = '<circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
  const MOON_PATH = '<path d="M20.2 14.6A8.5 8.5 0 1 1 9.4 3.8a7 7 0 0 0 10.8 10.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/>';

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    if(theme === 'light'){
      themeIcon.innerHTML = SUN_PATH; themeIcon.style.color = 'var(--caution)'; themeLabel.textContent = '라이트 모드';
    }else{
      themeIcon.innerHTML = MOON_PATH; themeIcon.style.color = 'var(--accent)'; themeLabel.textContent = '다크 모드';
    }
  }

  function initTheme(){
    // 로컬 스토리지 제거
    let saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    applyTheme(saved);
  }

  themeToggleBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
  });
  initTheme();

  /* ---- 상위 설정 변수 ---- */
  const THRESHOLD_DATE = new Date('2025-01-14T11:35:00+09:00');
  const REG_DATE_CUTOFF = new Date('2026-06-01T00:00:00+09:00');
  const CHAPI_BASE = 'https://chapi.sooplive.com/api';
  const INFO_API   = 'https://api.m.sooplive.com/station/video/a/view';

  const streamerListEl = $('#streamerList');
  const minInput = $('#minCount');
  const maxInput = $('#maxCount');
  const deleteSoonOnly = $('#deleteSoonOnly');
  const fetchBtn = $('#fetchBtn');
  const meter = $('#meter');
  const statusText = $('#statusText');
  const resultsEl = $('#results');
  const resultsCount = $('#resultsCount');
  const refreshTimerEl = $('#refreshTimer');
  const refreshBtnEl = $('#refreshBtn');

  let streamers = []; 
  let store = [];
  let busy = false;
  let selectedStreamerFilter = 'all';
  let selectedManualVods = new Map(); 

  // 스트리머 아이디로 고유한 HSL 색상을 생성하는 함수
  function getStreamerColor(str) {
    if(!str) return 'var(--accent)';
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const h = Math.abs(hash) % 360;
    return `hsl(${h}, 70%, 55%)`;
  }

  /* ---- 스트리머 리스트 관리 로직 ---- */
  function loadSavedStreamers() {
    // 로컬 스토리지 제거
    renderStreamerList();
  }

  function saveStreamers() {
    // 로컬 스토리지 제거됨
  }

  function addStreamer(id) {
    if(!id) return;
    id = id.toLowerCase().trim(); // 아이디는 소문자로 정규화
    if(streamers.find(s => s.id === id)) {
      alert('이미 등록된 아이디입니다.');
      return;
    }
    streamers.push({ id, nickname: id, img: null, state: 'loading' });
    saveStreamers();
    renderStreamerList();
    fetchStreamerProfile(id);
    
    // 추가 후 리스트를 갱신하도록 가이드
    if (store.length > 0) {
       setStatus(`새 아이디가 등록되었습니다. <b>[목록 조회 시작]</b> 버튼을 다시 눌러주세요.`);
    }
  }

  $('#addStreamerBtn').addEventListener('click', () => {
    const id = $('#newStreamerId').value;
    addStreamer(id);
    $('#newStreamerId').value = '';
  });

  $('#newStreamerId').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') {
      addStreamer(e.target.value);
      e.target.value = '';
    }
  });

  function renderStreamerList(){
    if (streamers.length === 0) {
      streamerListEl.innerHTML = '<span style="font-size:12px; color:var(--text-muted); margin-top:6px;">등록된 아이디가 없습니다. 위 입력창에서 추가해주세요.</span>';
      return;
    }

    streamerListEl.innerHTML = streamers.map(s => {
      const initial = (s.nickname || s.id).slice(0,1).toUpperCase();
      const avatarInner = s.img ? `<img src="${s.img}" referrerpolicy="no-referrer" onerror="this.parentElement.textContent='${initial}'">` : initial;
      const isActive = selectedStreamerFilter === s.id;
      
      const themeColor = getStreamerColor(s.id);
      const bgMix = `color-mix(in srgb, ${themeColor} 16%, transparent)`;

      return `
        <div class="streamer-tag${isActive ? ' is-active' : ''}" data-id="${s.id}" title="클릭하면 이 스트리머만 필터링됩니다" 
             style="${isActive ? `border-color:${themeColor}; background:${bgMix};` : ''}">
          <div class="streamer-tag-avatar" style="color:${themeColor}; background:${bgMix};">${avatarInner}</div>
          <div>
            <div class="streamer-tag-nick" style="${isActive ? `color:${themeColor};` : ''}">${s.state === 'loading' ? '불러오는 중…' : (s.nickname || s.id)}</div>
            <div class="streamer-tag-id">@${s.id}</div>
          </div>
          <button class="remove-streamer" data-id="${s.id}" title="삭제">×</button>
        </div>`;
    }).join('');
  }

  streamerListEl.addEventListener('click', e => {
    // 삭제 버튼 클릭 시
    const removeBtn = e.target.closest('.remove-streamer');
    if(removeBtn) {
      e.stopPropagation(); // 필터 토글 이벤트 방지
      const id = removeBtn.dataset.id;
      streamers = streamers.filter(s => s.id !== id);
      if(selectedStreamerFilter === id) selectedStreamerFilter = 'all';
      
      // 스토어에서 해당 스트리머 영상 제거
      store = store.filter(vod => vod.userId !== id);
      
      saveStreamers();
      renderStreamerList();
      render();
      return;
    }

    // 태그 전체 클릭 시 필터
    const tag = e.target.closest('.streamer-tag');
    if(!tag) return;
    const id = tag.dataset.id;
    selectedStreamerFilter = (selectedStreamerFilter === id) ? 'all' : id;
    renderStreamerList(); 
    render();
  });

  async function fetchStreamerProfile(userId){
    const entry = streamers.find(s => s.id === userId);
    try{
      const res = await fetch(`https://api-channel.sooplive.com/v1.1/channel/${encodeURIComponent(userId)}/station`, { headers: { 'Accept':'application/json' }});
      if(!res.ok) throw new Error('profile error');
      const json = await res.json();
      const station = json?.station || json?.data?.station || json?.data || {};
      if(entry){ 
        entry.nickname = station.userNick ?? station.user_nick ?? station.nickname ?? userId; 
        entry.img = station.profileImage ?? station.profile_image ?? station.stationImage ?? station.station_image ?? ''; 
        entry.state = 'done'; 
      }
    }catch(e){
      if(entry){ entry.nickname = userId; entry.state = 'done'; }
    }
    renderStreamerList(); 
    render();
  }

  function nicknameFor(userId){ 
    const s = streamers.find(s => s.id === userId); 
    return s ? (s.nickname || s.id) : userId; 
  }

  /* ---- 데이터 수집 및 렌더링 로직 ---- */
  resultsEl.addEventListener('change', (e) => {
    if(e.target.classList.contains('manual-cb')){
      const cb = e.target;
      if(cb.checked){
        selectedManualVods.set(cb.dataset.titleno, {
          titleNo: cb.dataset.titleno,
          title: cb.dataset.title,
          userId: cb.dataset.userid
        });
      } else {
        selectedManualVods.delete(cb.dataset.titleno);
      }
    }
  });

  function parseDate(str){
    if(!str) return new Date();
    return new Date(str.replace(' ', 'T') + '+09:00');
  }

  function calcDisplayCount(vod){
    const isOld = parseDate(vod.regDate) < THRESHOLD_DATE;
    const c = isOld ? (vod.basicCount || vod.count) : vod.count;
    return Number.isFinite(c) ? c : 0;
  }

  function computeDeletionWarning(vod){
    if(vod.isPerm || !vod.autoDeleteDate) return {warn:false, daysLeft:null};
    const expire = parseDate(vod.autoDeleteDate).getTime();
    if(Number.isNaN(expire)) return {warn:false, daysLeft:null};
    const msLeft = expire - Date.now();
    const daysLeft = Math.ceil(msLeft/86400000);
    if(msLeft <= 0) return {warn:true, daysLeft:0};
    return {warn: daysLeft <= 30, daysLeft};
  }

  function setMeter(active){ meter.classList.toggle('active', active); }
  function setStatus(html){ statusText.innerHTML = html; }

  function normalizeVodItem(raw){
    const ucc = raw.ucc || {};
    const fileType = ucc.file_type ?? ucc.fileType;
    if(fileType !== 'REVIEW') return null;
    const titleNo = String(raw.title_no ?? raw.titleNo ?? '');
    if(!titleNo) return null;
    const count = raw.count || {};
    const vodRead = count.vod_read_cnt ?? count.vodReadCnt;
    if(vodRead === undefined || vodRead === null) return null;
    const basicRaw = count.read_cnt ?? count.readCnt ?? raw.read_cnt ?? raw.view_cnt ?? 0;

    const authNo = raw.authNo ?? raw.auth_no ?? 101;
    const isSubscriptionOnly = Number(authNo) !== 101;
    const grade = ucc.grade ?? ucc.gradeType ?? raw.grade ?? 0;
    const isAgeLimited = Number(grade) !== 0;

    if(isAgeLimited || isSubscriptionOnly) return null;

    return {
      titleNo,
      userId: raw.user_id ?? raw.userId ?? ucc.user_id ?? ucc.userId ?? null,
      stationNo: raw.station_no ?? raw.stationNo ?? ucc.station_no ?? ucc.stationNo ?? null,
      bbsNo: raw.bbs_no ?? raw.bbsNo ?? ucc.bbs_no ?? ucc.bbsNo ?? null,
      regDate: raw.reg_date ?? raw.regDate ?? null,
      basicCount: parseInt(basicRaw,10) || 0,
      count: vodRead,
      title: raw.title_name ?? raw.titleName ?? raw.title ?? ucc.title ?? '제목없음',
      thumb: ucc.thumb ?? raw.thumb ?? '',
      vodUrl: `https://vod.sooplive.com/player/${titleNo}`,
      isPerm: false, autoDeleteDate: null, infoState: 'pending'
    };
  }

  async function fetchAllVods(userId){
    const items = [];
    const url = `${CHAPI_BASE}/${encodeURIComponent(userId)}/vods/review?per_page=60&page=1`;
    setStatus(`목록 수집 중… (${userId})`);
    const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
    if(!res.ok) throw new Error(`목록 API 응답 오류 (HTTP ${res.status})`);
    const json = await res.json();
    const list = json?.data || json?.contents || [];
    list.forEach(raw => {
      const item = normalizeVodItem(raw);
      if(item && parseDate(item.regDate) >= REG_DATE_CUTOFF) items.push(item);
    });
    return items;
  }

  async function fetchInfo(vod){
    const params = new URLSearchParams({
      nTitleNo: vod.titleNo, nStationNo: vod.stationNo || '', nBbsNo: vod.bbsNo || ''
    });
    const res = await fetch(INFO_API, {
      method: 'POST',
      headers: { 'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8' },
      body: params.toString()
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if(!json || json.result !== 1) throw new Error('empty result');
    const data = json.data || {};
    const v = data.vod || data;
    vod.regDate = v.reg_date ?? vod.regDate;
    vod.autoDeleteDate = v.auto_delete_date ?? null;
    vod.isPerm = v.permanence === 'Y';
    vod.infoState = 'done';
  }

  async function fetchInfoBatch(vods, concurrency, onProgress){
    let idx = 0, done = 0;
    async function worker(){
      while(idx < vods.length){
        const vod = vods[idx++];
        try{ await fetchInfo(vod); } catch(e){ vod.infoState = 'error'; }
        done++; onProgress(done, vods.length);
      }
    }
    await Promise.all(Array.from({length: Math.min(concurrency, vods.length)}, worker));
  }

  function getFiltered(){
    const min = parseInt(minInput.value,10) || 0;
    const max = parseInt(maxInput.value,10) || 0;
    const streamerSel = selectedStreamerFilter;
    let filtered = store.filter(vod => {
      if(streamerSel !== 'all' && vod.userId !== streamerSel) return false;
      const dc = calcDisplayCount(vod);
      if(dc < min || dc > max) return false;
      if(deleteSoonOnly.checked && !computeDeletionWarning(vod).warn) return false;
      return true;
    });

    const listSortVal = $('#listSortOrder').value;
    if (listSortVal === 'oldest') {
      filtered.sort((a, b) => parseDate(a.regDate) - parseDate(b.regDate));
    } else if (listSortVal === 'views_asc') {
      filtered.sort((a, b) => calcDisplayCount(a) - calcDisplayCount(b));
    } else if (listSortVal === 'views_desc') {
      filtered.sort((a, b) => calcDisplayCount(b) - calcDisplayCount(a));
    } else {
      filtered.sort((a, b) => parseDate(b.regDate) - parseDate(a.regDate)); // newest
    }

    return filtered;
  }

  function fmtDate(str){
    if(!str) return '';
    const m = String(str).match(/\d{4}-\d{2}-\d{2}/);
    return m ? m[0] : '';
  }

  function render(){
    const filtered = getFiltered();
    resultsCount.textContent = `${filtered.length}개`;
    if(filtered.length === 0){
      resultsEl.innerHTML = `<div class="empty">조건에 맞는 영상이 없습니다.</div>`; return;
    }
    const rows = filtered.map((vod, i) => {
      const dc = calcDisplayCount(vod);
      const delWarn = computeDeletionWarning(vod);
      let badge = '';
      if(vod.infoState === 'pending') badge = `<span class="badge pending">조회중…</span>`;
      else if(vod.isPerm) badge = `<span class="badge good">✔ 영구보관</span>`;
      else if(delWarn.daysLeft !== null){
        badge = `<span class="badge ${delWarn.warn ? 'warn':'pending'}">🗑 ${delWarn.daysLeft > 0 ? delWarn.daysLeft + '일 후' : '기한초과'}</span>`;
      }
      
      const safeTitle = (vod.title || '제목없음').replace(/</g,'&lt;');
      const isPlaying = openPlayers.some(p => p.titleNo === vod.titleNo);
      const playingTag = isPlaying ? `<span class="badge good" style="margin-left:4px;">▶ 재생중</span>` : '';

      const tColor = getStreamerColor(vod.userId);
      const streamerTag = streamers.length > 1 && vod.userId
        ? `<span style="font-size:10.5px;color:${tColor};background:color-mix(in srgb, ${tColor} 16%, transparent);padding:1px 6px;border-radius:5px;margin-right:6px;white-space:nowrap;">${nicknameFor(vod.userId)}</span>`
        : '';
        
      const isChecked = selectedManualVods.has(vod.titleNo) ? 'checked' : '';

      return `
        <div class="list-row" style="${isPlaying ? 'border-left:2px solid var(--accent);background:var(--surface-2);' : ''}">
          <div class="list-main">
            <input type="checkbox" class="manual-cb" data-titleno="${vod.titleNo}" data-title="${safeTitle}" data-userid="${vod.userId}" ${isChecked} style="width:16px; height:16px; margin-right:6px; cursor:pointer; accent-color:var(--accent);">
            
            <div class="list-rank">${i+1}</div>
            <div class="thumb"><img src="${vod.thumb}" loading="lazy" alt="썸네일"></div>
            <div class="list-title">${streamerTag}<a href="${vod.vodUrl}" target="_blank" rel="noopener">${safeTitle}</a></div>
          </div>
          <div class="list-meta">
            <span class="list-count" style="color:${dc < 1000 ? 'var(--warn)' : 'var(--good)'}">👁 ${dc.toLocaleString()}</span>
            <span class="list-date">${fmtDate(vod.regDate)}</span>
            ${badge}${playingTag}
          </div>
        </div>`;
    }).join('');
    resultsEl.innerHTML = `<div class="list">${rows}</div>`;
  }

  // 1분 자동 갱신 및 영상 교체 필터
  function getSortedAvailableVods() {
    const filtered = getFiltered();
    const sortVal = $('#sortOrder').value;
    
    let sorted = [...filtered];
    if (sortVal === 'oldest') {
      sorted.sort((a, b) => parseDate(a.regDate) - parseDate(b.regDate));
    } else if (sortVal === 'newest') {
      sorted.sort((a, b) => parseDate(b.regDate) - parseDate(a.regDate));
    } else if (sortVal === 'views_asc') {
      sorted.sort((a, b) => calcDisplayCount(a) - calcDisplayCount(b));
    } else if (sortVal === 'views_desc') {
      sorted.sort((a, b) => calcDisplayCount(b) - calcDisplayCount(a));
    }
    return sorted;
  }

  const VIEWCOUNT_REFRESH_MS = 1 * 60 * 1000;
  let viewCountRefreshTimer = null, countdownDisplayTimer = null, nextRefreshAt = null;

  function updateRefreshCountdown(){
    if(!nextRefreshAt){ refreshTimerEl.textContent = ''; return; }
    const msLeft = nextRefreshAt - Date.now();
    if(msLeft <= 0){ refreshTimerEl.textContent = '갱신 중…'; return; }
    const totalSec = Math.ceil(msLeft/1000);
    refreshTimerEl.textContent = `다음 갱신까지 ${String(Math.floor(totalSec/60)).padStart(2,'0')}:${String(totalSec%60).padStart(2,'0')}`;
  }

  function startViewCountRefreshTimer(){
    if(viewCountRefreshTimer) clearInterval(viewCountRefreshTimer);
    viewCountRefreshTimer = setInterval(refreshViewCounts, VIEWCOUNT_REFRESH_MS);
    nextRefreshAt = Date.now() + VIEWCOUNT_REFRESH_MS;
    if(countdownDisplayTimer) clearInterval(countdownDisplayTimer);
    countdownDisplayTimer = setInterval(updateRefreshCountdown, 1000);
    refreshBtnEl.disabled = false; updateRefreshCountdown();
  }

  function stopViewCountRefreshTimer(){
    if(viewCountRefreshTimer) clearInterval(viewCountRefreshTimer); viewCountRefreshTimer = null;
    if(countdownDisplayTimer) clearInterval(countdownDisplayTimer); countdownDisplayTimer = null;
    nextRefreshAt = null; refreshTimerEl.textContent = ''; refreshBtnEl.disabled = true;
  }

  async function refreshViewCounts(){
    if(busy || streamers.length === 0 || store.length === 0) return;
    refreshBtnEl.disabled = true; refreshBtnEl.classList.add('spinning');
    try{
      const results = await Promise.allSettled(streamers.map(s => fetchAllVods(s.id)));
      const freshByTitleNo = new Map();
      results.forEach(r => { if(r.status === 'fulfilled') r.value.forEach(item => freshByTitleNo.set(item.titleNo, item)); });
      store.forEach(vod => {
        const fresh = freshByTitleNo.get(vod.titleNo);
        if(fresh){ vod.count = fresh.count; vod.basicCount = fresh.basicCount; }
      });
      
      render();

      if (openPlayers.length > 0) {
        let needsUpdate = false;
        const keepPlayers = [];
        const currentFiltered = getFiltered(); 

        openPlayers.forEach(p => {
          const stillValid = currentFiltered.some(v => v.titleNo === p.titleNo);
          if (stillValid) {
            keepPlayers.push(p);
          } else {
            needsUpdate = true; 
          }
        });

        openPlayers = keepPlayers;

        const n = Math.max(0, Math.min(MAX_PLAYERS, parseInt(playCountInput.value, 10) || 0));
        const needed = n - openPlayers.length;

        if (needed > 0) {
          const sortedAvailable = getSortedAvailableVods();
          const available = sortedAvailable.filter(v => !openPlayers.some(p => p.titleNo === v.titleNo));
          
          const autoSelected = available.slice(0, needed).map(v => ({
            titleNo: v.titleNo, 
            title: v.title || '제목없음', 
            userId: v.userId 
          }));
          
          openPlayers = openPlayers.concat(autoSelected);
          if (autoSelected.length > 0) needsUpdate = true;
        }

        if (needsUpdate) {
          renderPlayers();
          render(); 
        }
      }

      const now = new Date();
      setStatus(`완료 — 총 <b>${store.length}</b>건 수집 · 자동 갱신 및 영상교체 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`);
    }catch(e){
      console.debug('갱신 실패:', e);
    }finally{
      refreshBtnEl.classList.remove('spinning'); refreshBtnEl.disabled = store.length === 0;
    }
  }

  refreshBtnEl.addEventListener('click', async () => {
    if(refreshBtnEl.disabled || busy) return;
    await refreshViewCounts();
    if(store.length > 0) startViewCountRefreshTimer();
  });

  async function runFetch(){
    if(streamers.length === 0) {
      alert("스트리머 아이디를 먼저 등록해주세요.");
      return;
    }
    if(busy) return;
    busy = true; fetchBtn.disabled = true; setMeter(true); stopViewCountRefreshTimer();
    resultsEl.innerHTML = ''; store = []; render();

    try{
      setStatus(`목록 수집 준비 중… (스트리머 <b>${streamers.length}</b>명)`);
      const results = await Promise.allSettled(streamers.map(s => fetchAllVods(s.id)));
      const items = [], failed = [];
      results.forEach((r, i) => { if(r.status === 'fulfilled') items.push(...r.value); else failed.push(streamers[i].id); });

      store = items;
      setStatus(`목록 <b>${items.length}</b>건 수집 완료${failed.length ? ` (실패: ${failed.join(', ')})` : ''} — 영구보관 정보 조회 중…`);
      render();

      await fetchInfoBatch(items, 5, (done, total) => { setStatus(`영구보관 정보 조회 중… <b>${done}</b> / ${total}`); render(); });

      setStatus(`완료 — 총 <b>${items.length}</b>건 수집${failed.length ? ` (실패: ${failed.join(', ')})` : ''}`);
      startViewCountRefreshTimer();
    }catch(err){
      resultsEl.innerHTML = `<div class="error-box"><b>오류가 발생했습니다</b>${err.message || String(err)}</div>`; setStatus('오류로 중단됨');
    }finally{
      setMeter(false); fetchBtn.disabled = false; busy = false;
    }
  }

  /* ---- 플레이어 제어 로직 ---- */
  const playerBox = $('#playerBox'), playerGrid = $('#playerGrid'), playerCount = $('#playerCount'), playerCloseAll = $('#playerCloseAll');
  const MAX_PLAYERS = 10, REFRESH_MS = 60000;
  let openPlayers = [], refreshTimer = null;

  function embedSrc(titleNo){ 
    return `https://vod.sooplive.com/player/${titleNo}/embed?showChat=false&autoPlay=true&mutePlay=true&quality=540p&_r=${Date.now()}`; 
  }
  
  function refreshAllPlayers(){ 
    playerGrid.querySelectorAll('iframe[data-titleno]').forEach(f => { f.src = embedSrc(f.dataset.titleno); }); 
  }
  
  function ensureRefreshTimer(){
    if(openPlayers.length === 0){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; } return; }
    if(!refreshTimer) refreshTimer = setInterval(refreshAllPlayers, REFRESH_MS);
  }

  function renderPlayers(){
    playerBox.hidden = openPlayers.length === 0;
    playerCount.textContent = openPlayers.length ? `(${openPlayers.length}/${MAX_PLAYERS})` : '';
    playerGrid.innerHTML = openPlayers.map(p => `
      <div class="player-cell" style="background:#000;border-radius:8px;overflow:hidden;position:relative;">
        <button class="player-x" data-titleno="${p.titleNo}" title="닫기"
          style="position:absolute;top:6px;right:6px;z-index:2;width:24px;height:24px;border-radius:50%;
          background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:1;">✕</button>
        <div style="position:relative;width:100%;padding-top:56.25%;">
          <iframe data-titleno="${p.titleNo}" src="${embedSrc(p.titleNo)}" frameborder="0" allowfullscreen="true" allow="clipboard-write; web-share;" style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>
        </div>
        <div style="padding:6px 9px;font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.title}</div>
      </div>`).join('');
    ensureRefreshTimer();
  }
  
  function closeEmbed(titleNo){ 
    openPlayers = openPlayers.filter(p => p.titleNo !== titleNo); 
    renderPlayers(); 
    render(); 
  }

  const playCountInput = $('#playCount');
  const startBatchPlayBtn = $('#startBatchPlayBtn');

  startBatchPlayBtn.addEventListener('click', () => {
    if(store.length === 0) {
      alert("먼저 [목록 조회 시작] 버튼을 눌러 영상 목록을 불러와주세요.");
      return;
    }

    const n = Math.max(0, Math.min(MAX_PLAYERS, parseInt(playCountInput.value, 10) || 0));
    if(n === 0) return;
    
    let desired = Array.from(selectedManualVods.values()).slice(0, n);
    const needed = n - desired.length;
    
    if (needed > 0) {
      const sortedAvailable = getSortedAvailableVods();
      const available = sortedAvailable.filter(v => !selectedManualVods.has(v.titleNo));
      
      const autoSelected = available.slice(0, needed).map(v => ({
        titleNo: v.titleNo, 
        title: v.title || '제목없음', 
        userId: v.userId 
      }));
      
      desired = desired.concat(autoSelected);
    }

    if(desired.length === 0){
        alert("재생할 조건에 맞는 영상이 없습니다.");
        return;
    }

    openPlayers = desired; 
    renderPlayers();
    
    selectedManualVods.clear();
    render(); 
  });

  playerCloseAll.addEventListener('click', () => { openPlayers = []; renderPlayers(); render(); });
  playerGrid.addEventListener('click', e => { const btn = e.target.closest('.player-x'); if(btn) closeEmbed(btn.dataset.titleno); });
  
  fetchBtn.addEventListener('click', runFetch);
  [minInput, maxInput, deleteSoonOnly].forEach(el => el.addEventListener('input', render));
  deleteSoonOnly.addEventListener('change', render);
  $('#listSortOrder').addEventListener('change', render);

  // 초기 시작 시 저장된 아이디 불러오기
  loadSavedStreamers();

</script>
</body>
</html>
